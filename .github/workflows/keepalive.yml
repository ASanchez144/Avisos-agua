name: keepalive
# GitHub desactiva los workflows programados tras 60 días sin actividad en el repositorio.
# Cada semana se vuelve a habilitar el colector con la API oficial (sin acciones de terceros).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-habilitar el colector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collector.yml/enable"
