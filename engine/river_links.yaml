# Relaciones cabecera -> valle para el motor de propagación (engine/propagation.py).
#
# DISTANCIAS: ninguna está medida sobre el cauce. Todas van marcadas ESTIMADA y la UI
# debe mostrarlo. Dos tipos:
#   - Sin `distance_km`: el motor la calcula como poligonal en línea recta entre las
#     coordenadas indicadas (origen, puntos intermedios, destino). Es una COTA INFERIOR:
#     el cauce real es más largo, así que la llegada real será algo más tardía.
#   - Con `distance_km`: cifra del proyecto sin fuente verificada (se dice en la fuente).
#
# COORDENADAS Y COTAS (verificadas con petición real el 2026-11-11):
#   MITECO-ROEA = FeatureServer SAIH de MITECO, capa 1 "Red Integrada de Estaciones de Aforos (SAIH-ROEA)".
#   MITECO-SAIH = mismo servicio, capa 5 "Estaciones de Aforo en río SAIH (Caudal)".
#   SAI-CHC     = visor oficial del SAI Cantábrico.

triggers:
  consecutive_readings: 2    # lecturas consecutivas que deben cumplir la condición (evita un pico suelto)
  max_age_minutes: 120       # antigüedad máxima de la última lectura (AEMET publica el horario con ~1 h de retraso)
  hour_tolerance_minutes: 15 # margen para encontrar la lectura de "hace 1 h"
  max_gap_minutes: 90        # separación máxima entre lecturas consecutivas
  # Dos niveles. Valores calibrados con la DANA del 29/10/2024: ver docs/CALIBRATION.md
  vigilancia:
    rain_mm_h: 20.0
    flow_rise_pct_1h: 30.0
    min_flow_m3s: 5.0
  alerta:
    rain_mm_h: 40.0
    flow_rise_pct_1h: 100.0
    min_flow_m3s: 50.0

regimes:
  rio:
    speed_kmh_min: 6.0
    speed_kmh_max: 14.0
    status: ESTIMADA
    source: >-
      Rango 6-14 km/h fijado en la especificación del proyecto para la velocidad de la onda de
      crecida según la pendiente. No está contrastado con medidas de cada tramo: se usa el rango
      completo y por eso la llegada se da siempre como intervalo.
  rambla:
    speed_kmh_min: null
    speed_kmh_max: null
    status: SIN_REFERENCIA
    source: >-
      Sin referencia verificable para la velocidad de la onda en barrancos y ramblas mediterráneos
      (no se ha encontrado ninguna fuente citable). Por eso NO se da rango horario: solo aviso
      cualitativo "subida detectada en cabecera". Si se localiza una fuente (CHJ, CEDEX), se
      rellenan speed_kmh_min/max aquí.

