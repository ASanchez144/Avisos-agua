server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API del backend se sirve bajo /api (mismo origen: sin CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
