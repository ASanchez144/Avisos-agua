<script language="javascript">
	var tiposeleccionado = 0;
	function recargar(){
		parent.document.getElementById("iframe_izq").src="cauces3.php?tipo="+tiposeleccionado;	
		document.location.reload();
	}
	function set_zona(zona){
		if(zona=="0")
			document.location="topo_cauces1.php?tipo="+tiposeleccionado;
		else		
			document.location="topo_cauces2.php?zona="+zona+"&tipo="+tiposeleccionado;
	}

	$(document).ready(function (){  
		$(".draggable").draggable();

		cauces(tiposeleccionado);
	});
	/*****************************************************************************************************************************************************/
	/**	MUESTRA LOS CAUCES
	/*****************************************************************************************************************************************************/
	function cauces(tipo){

		tiposeleccionado = tipo;

		if (tipo == 0) {var imgmenu0 = "../comunes/imgVisor/b_caudales_cauces_on.png";} else{var imgmenu0 = "../comunes/imgVisor/b_caudales_cauces_off.png";}
		if (tipo == 1) {var imgmenu1 = "../comunes/imgVisor/b_caudales_canales_on.png";} else{var imgmenu1 = "../comunes/imgVisor/b_caudales_canales_off.png";}
		if (tipo == 2) {var imgmenu2 = "../comunes/imgVisor/b_caudales_acequias_on.png";} else{var imgmenu2 = "../comunes/imgVisor/b_caudales_acequias_off.png";}
		if (tipo == 3) {var imgmenu3 = "../comunes/imgVisor/b_caudales_impulsiones_on.png";} else{var imgmenu3 = "../comunes/imgVisor/b_caudales_impulsiones_off.png";}
		$("#img_0").attr("src",imgmenu0);
		$("#img_1").attr("src",imgmenu1);
		$("#img_2").attr("src",imgmenu2);
		$("#img_3").attr("src",imgmenu3);

		var fechaactual = "11-11-2026 12:40";
		//var imgescala = "../comunes/imgVisor/visor_new_escala_volumenes.png";
		var textopie = "Los colores de la leyenda se corresponden con la variable de Nivel en Cauces y no con umbrales de comunicación de avisos.<br>Caudales en m<sup>3</sup>/s | <span style='color: #ff0000'>\"-\" Caudal en desbordamiento, disponible dato de nivel</span>. Datos SAIH en tiempo real sin contrastar a <b>"+fechaactual+"</b><br>";
		textopie += "<a href='javascript:recargar();'><img src='../comunes/imgVisor/b_actualizar.png' border='0'></a>";
		var imgmapatopo = "../comunes/imgVisor/topologicos/mapa_cauces_topologico.png"

		//$("#escala").css("background","url("+imgescala+")");
		$("#info").html(textopie);
		$("#img_mapatopo").attr("src",imgmapatopo);
		$("#img_mapatopo").attr("border",0);
		$("#panel_cauces").html("");
		$.ajax({
			type: "POST",
			dataType: "json",
			url: "obtener_datos.php",
			data: "action=consultar_cauces_topo",
			success: function(data){
			for (var x = 0 ; x < data.length ; x++) {

				
				var cajetin = "<div id='"+data[x].CodPuntoMedicion+"' class='cauce_topo_container' style='top:"+data[x].x+"px; left:"+data[x].y+"px; background-color:"+data[x].ColorFondo+";' ";
				if(data[x].CodVariableHidrologicaNivel == null){
					cajetin += "title='"+data[x].CodPuntoMedicion+" "+data[x].NombreCortoPM+": "+data[x].CodVariableHidrologicaCaudal;
				}
				else{
					if(data[x].CotaMaximaSeccion == "-"){
						cajetin += "title='"+data[x].CodPuntoMedicion+" "+data[x].NombreCortoPM+": "+data[x].CodVariableHidrologicaCaudal+" ("+data[x].UltimoDatoNivel+" m )";
					}
					else{
						cajetin += "title='"+data[x].CodPuntoMedicion+" "+data[x].NombreCortoPM+": "+data[x].CodVariableHidrologicaCaudal+" ("+data[x].UltimoDatoNivel+" m / "+data[x].CotaMaximaSeccion+" m = "+data[x].PorcentajeNivel+" %)";
					}
				}
				cajetin += "'>";
				if(data[x].UltimoDatoCaudal == "-")
				{
					if(data[x].ColorFondo == "#FF0000")
						cajetin += "<a style='color:#000000;' href='visor_variable.php?punto="+data[x].CodVariableHidrologicaCaudal+"'>"+data[x].UltimoDatoCaudal+"</a>";
					else
						cajetin += "<a style='color:#FF0000;' href='visor_variable.php?punto="+data[x].CodVariableHidrologicaCaudal+"'>"+data[x].UltimoDatoCaudal+"</a>";
				}
				else
				{
					colorTexto = data[x].ColorTexto;
					cajetin += "<a style='color:"+colorTexto+";' href='visor_variable.php?punto="+data[x].CodVariableHidrologicaCaudal+"'>"+data[x].UltimoDatoCaudal+"</a>";
				}
				cajetin += "</div>";
				//alert("cajetin="+cajetin);
				$("#panel_cauces").append(cajetin);
			}
			}
		});
		parent.document.getElementById("iframe_izq").src="cauces3.php?tipo="+tipo;	
		
	}
</script>
